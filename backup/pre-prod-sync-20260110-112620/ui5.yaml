specVersion: '3.1'
metadata:
  name: sap.vic.dashboard
type: application
framework:
  name: SAPUI5
  version: "1.120.13"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.viz
    - name: sap.ui.export
    - name: themelib_sap_horizon

server:
  customMiddleware:
    # ABAP OData /sap/opu/odata/sap/*
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /sap
      configuration:
        baseUri: "https://ldcieca.wdf.sap.corp:44377"
        strictSSL: false
    # Flex/LREP services (/bc/lrep/*) needed for UI5 flexibility
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /bc
      configuration:
        baseUri: "https://ldcieca.wdf.sap.corp:44377"
        strictSSL: false
    # Image comparator backend
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /VIC_UI_DEV
      configuration:
        baseUri: "https://visual-image-comparator-service.cfapps.eu12.hana.ondemand.com"
        strictSSL: false
    # EPVP JSON endpoint (same service host)
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /EPVP
      configuration:
        baseUri: "https://visual-image-comparator-service.cfapps.eu12.hana.ondemand.com"
        strictSSL: false
